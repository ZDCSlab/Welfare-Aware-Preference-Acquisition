[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wapa"
version = "0.1.0"
description = "Welfare-Aware Preference Acquisition for Pluralistic Alignment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=15", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
inference = ["torch>=2.4", "transformers>=4.45,<5", "peft>=0.13", "accelerate>=1"]
api = ["openai>=1"]
download = ["huggingface-hub>=0.26"]

[project.scripts]
wapa = "wapa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
